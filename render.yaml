# Render Blueprint: веб-сервис Django + PostgreSQL.
# Render → New → Blueprint → выбрать репозиторий quixzet/quixzet.
services:
  - type: web
    name: quixzet
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn project.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SERVE_MEDIA
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: quixzet-db
          property: connectionString

databases:
  - name: quixzet-db
    plan: free
    databaseName: quixzet
    user: quixzet
